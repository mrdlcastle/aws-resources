AWSTemplateFormatVersion: "2010-09-09"
Description: >
  VPC with public/private subnets and a gaming EC2 instance.
  Supports launching a new instance or restoring from an EBS snapshot backup.
  Designed for ephemeral gaming sessions — deploy when playing, tear down when done.

Parameters:
  pInstanceType:
    Type: String
    Default: g4dn.xlarge
    Description: EC2 instance type. g4dn family provides GPU for gaming.
    AllowedValues:
      - g4dn.xlarge
      - g4dn.2xlarge
      - g4dn.4xlarge
      - t3.xlarge
      - t3.2xlarge
      - m5.xlarge
      - m5.2xlarge

  pAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-windows-latest/Windows_Server-2022-English-Full-Base
    Description: AMI ID for the instance. Defaults to latest Windows Server 2022.

  pKeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of an existing EC2 key pair for RDP/SSH access.

  pVpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for the VPC.

  pPublicSubnetCidr:
    Type: String
    Default: 10.0.1.0/24
    Description: CIDR block for the public subnet.

  pPrivateSubnetCidr:
    Type: String
    Default: 10.0.2.0/24
    Description: CIDR block for the private subnet.

  pMyIpCidr:
    Type: String
    Description: Your public IP in CIDR notation (e.g. 203.0.113.25/32) for access restriction.
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$

  pSnapshotId:
    Type: String
    Default: ""
    Description: >
      EBS snapshot ID to restore from (e.g. snap-0abc123def456). Leave empty for a fresh instance.

  pVolumeSize:
    Type: Number
    Default: 100
    Description: Root EBS volume size in GB.

  pVolumetype:
    Type: String
    Default: gp3
    AllowedValues:
      - gp3
      - gp2
      - io1
    Description: EBS volume type.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Network Configuration"
        Parameters:
          - pVpcCidr
          - pPublicSubnetCidr
          - pPrivateSubnetCidr
          - pMyIpCidr

      - Label:
          default: "Instance Configuration"
        Parameters:
          - pInstanceType
          - pAmiId
          - pKeyPairName
          - pVolumeSize
          - pVolumetype

      - Label:
          default: "Backup / Restore"
        Parameters:
          - pSnapshotId

    ParameterLabels:
      pInstanceType:
        default: "Instance Type"
      pAmiId:
        default: "AMI ID"
      pKeyPairName:
        default: "Key Pair Name"
      pVpcCidr:
        default: "VPC CIDR"
      pPublicSubnetCidr:
        default: "Public Subnet CIDR"
      pPrivateSubnetCidr:
        default: "Private Subnet CIDR"
      pMyIpCidr:
        default: "Your IP (CIDR)"
      pSnapshotId:
        default: "EBS Snapshot ID (leave empty for new)"
      pVolumeSize:
        default: "Volume Size (GB)"
      pVolumetype:
        default: "Volume Type"

Conditions:
  cRestoreFromSnapshot: !Not [!Equals [!Ref pSnapshotId, ""]]

Resources:
  # ============ VPC ============
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref pVpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: GamingVPC

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: GamingIGW

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # ============ Public Subnet ============
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref pPublicSubnetCidr
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: GamingPublicSubnet

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: GamingPublicRT

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # ============ Private Subnet ============
  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref pPrivateSubnetCidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: GamingPrivateSubnet

  # ============ NAT Gateway ============
  NatEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: GamingNatEIP

  NatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: AttachGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: GamingNatGW

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: GamingPrivateRT

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  # ============ VPC Endpoints for SSM ============
  SSMEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssm
      VpcId: !Ref VPC
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: true

  SSMMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssmmessages
      VpcId: !Ref VPC
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: true

  EC2MessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ec2messages
      VpcId: !Ref VPC
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: true

  VpcEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTPS from private subnet for VPC endpoints
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref pPrivateSubnetCidr
      Tags:
        - Key: Name
          Value: GamingVpcEndpointSG

  # ============ IAM Role for SSM ============
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub GamingInstanceRole-${AWS::StackName}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  # ============ Security Group ============
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for gaming instance - RDP and custom game ports
      VpcId: !Ref VPC
      SecurityGroupIngress:
        # RDP access
        - IpProtocol: tcp
          FromPort: 3389
          ToPort: 3389
          CidrIp: !Ref pMyIpCidr
        # Parsec / Moonlight / Steam streaming (TCP)
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8100
          CidrIp: !Ref pMyIpCidr
        # Parsec / Moonlight / Steam streaming (UDP)
        - IpProtocol: udp
          FromPort: 8000
          ToPort: 8100
          CidrIp: !Ref pMyIpCidr
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: GamingInstanceSG

  # ============ EC2 Instance ============
  GamingInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref pInstanceType
      ImageId: !Ref pAmiId
      KeyName: !Ref pKeyPairName
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref pVolumeSize
            VolumeType: !Ref pVolumetype
            DeleteOnTermination: false
            SnapshotId: !If [cRestoreFromSnapshot, !Ref pSnapshotId, !Ref "AWS::NoValue"]
      Tags:
        - Key: Name
          Value: GamingInstance

Outputs:
  oVpcId:
    Description: VPC ID
    Value: !Ref VPC

  oPublicSubnetId:
    Description: Public Subnet ID
    Value: !Ref PublicSubnet

  oPrivateSubnetId:
    Description: Private Subnet ID
    Value: !Ref PrivateSubnet

  oInstanceId:
    Description: EC2 Instance ID
    Value: !Ref GamingInstance

  oPrivateIp:
    Description: Private IP address of the gaming instance
    Value: !GetAtt GamingInstance.PrivateIp

  oSSMConnectCommand:
    Description: Connect to the instance via SSM Session Manager
    Value: !Sub "aws ssm start-session --target ${GamingInstance}"

  oSSMPortForwardCommand:
    Description: Port forward RDP through SSM (connect RDP client to localhost:3389)
    Value: !Sub "aws ssm start-session --target ${GamingInstance} --document-name AWS-StartPortForwardingSession --parameters portNumber=3389,localPortNumber=3389"

  oSnapshotReminder:
    Description: >
      Before deleting this stack, create a snapshot of the root volume to preserve your setup.
      Use: aws ec2 create-snapshot --volume-id <volume-id> --description "Gaming backup"
    Value: "Instance volume is set to persist on termination (DeleteOnTermination: false)"
